[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-scholium"
version = "0.1.1"
description = "Write reading results, human or model-generated, back into Zotero as native annotations: highlights with comments, margin text notes, and child notes. No plugin required on Zotero 10 and later."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["zotero", "annotations", "pdf", "research", "llm", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
scholium = "zotero_scholium.cli:main"

[project.urls]
Homepage = "https://github.com/weilr/zotero-scholium"
Issues = "https://github.com/weilr/zotero-scholium/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
