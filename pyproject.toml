[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-scholium"
version = "0.1.5"
description = "Let Claude Code or Codex read a paper and annotate it in Zotero: key sentences highlighted with translations, margin notes and a reading note, all as native Zotero annotations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["zotero", "annotations", "pdf", "research", "llm", "claude-code", "codex", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
scholium = "zotero_scholium.cli:main"

[project.urls]
Homepage = "https://github.com/weilr/zotero-scholium"
Issues = "https://github.com/weilr/zotero-scholium/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
