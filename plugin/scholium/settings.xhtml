<linkset>
  <html:link rel="localization" href="scholium.ftl"/>
</linkset>
<vbox class="scholium-settings">
  <groupbox>
    <label data-l10n-id="scholium-settings-send"/>
    <description data-l10n-id="scholium-settings-send-desc"/>
    <menulist preference="extensions.scholium.sendShortcut" native="true">
      <menupopup>
        <menuitem value="enter" data-l10n-id="scholium-settings-send-enter"/>
        <menuitem value="cmdIfMultiline" data-l10n-id="scholium-settings-send-multiline"/>
        <menuitem value="cmdAlways" data-l10n-id="scholium-settings-send-always"/>
      </menupopup>
    </menulist>
    <label data-l10n-id="scholium-settings-followup"/>
    <description data-l10n-id="scholium-settings-followup-desc"/>
    <radiogroup preference="extensions.scholium.followUpMode" orient="horizontal">
      <radio value="queue" data-l10n-id="scholium-settings-followup-queue"/>
      <radio value="steer" data-l10n-id="scholium-settings-followup-steer"/>
    </radiogroup>
    <description data-l10n-id="scholium-followup-claude-note"/>
    <checkbox preference="extensions.scholium.contextRing" data-l10n-id="scholium-settings-ring"/>
    <label data-l10n-id="scholium-settings-runs"/>
    <description data-l10n-id="scholium-settings-runs-desc"/>
    <menulist preference="extensions.scholium.maxRuns" native="true">
      <menupopup>
        <menuitem value="1" label="1"/>
        <menuitem value="2" label="2"/>
        <menuitem value="3" label="3"/>
        <menuitem value="4" label="4"/>
        <menuitem value="5" label="5"/>
        <menuitem value="6" label="6"/>
      </menupopup>
    </menulist>
  </groupbox>
  <groupbox>
    <label data-l10n-id="scholium-settings-claude"/>
    <description data-l10n-id="scholium-settings-program-desc"/>
    <hbox align="center">
      <html:input id="scholium-claude-path" type="text" style="flex: 1" preference="extensions.scholium.claudePath"/>
      <button id="scholium-claude-browse" data-l10n-id="scholium-settings-browse"/>
    </hbox>
    <label data-l10n-id="scholium-settings-codex"/>
    <hbox align="center">
      <html:input id="scholium-codex-path" type="text" style="flex: 1" preference="extensions.scholium.codexPath"/>
      <button id="scholium-codex-browse" data-l10n-id="scholium-settings-browse"/>
    </hbox>
    <label data-l10n-id="scholium-settings-codex-home"/>
    <description data-l10n-id="scholium-settings-codex-home-desc"/>
    <hbox align="center">
      <html:input id="scholium-codex-home" type="text" style="flex: 1" preference="extensions.scholium.codexHome"/>
      <button id="scholium-codex-home-browse" data-l10n-id="scholium-settings-browse"/>
    </hbox>
  </groupbox>
  <groupbox>
    <label data-l10n-id="scholium-check"/>
    <description data-l10n-id="scholium-check-desc"/>
    <hbox>
      <button id="scholium-check-run" data-l10n-id="scholium-check-run"/>
      <button id="scholium-check-copy" data-l10n-id="scholium-check-copy" hidden="true"/>
    </hbox>
    <vbox id="scholium-check-lines"/>
  </groupbox>
</vbox>
