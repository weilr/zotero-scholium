name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml runs these checks before it builds

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest runs on arm64, where setup-python's newest 3.9 build is 3.9.13
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.12"]   # the oldest supported (requires-python) and a recent one
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python scripts/check_skill_script_sync.py
      - run: python scripts/check_versions.py
      - run: python scripts/check_skill_frontmatter.py
      - run: python scripts/measure_context.py --max-skill-tokens 3000
      - run: pytest -q
      - name: syntax-check the plugin
        shell: bash
        run: for f in plugin/scholium/bootstrap.js plugin/scholium/modules/*.js; do node --check "$f" || exit 1; done
  xpi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: build scholium.xpi as release.yml does, and check the plugin's files and the skill it carries
        run: |
          python scripts/build_xpi.py build/scholium.xpi
          python scripts/check_xpi.py build/scholium.xpi
