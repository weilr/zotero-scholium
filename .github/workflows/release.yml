name: release

on:
  push:
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  xpi:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: the tag names the version of the package, the tool and the plugins
        run: python scripts/check_versions.py "${{ github.ref_name }}"
      - name: build scholium.xpi (with the skill in content/skill, which the plugin installs when an agent has none)
        run: |
          python scripts/build_xpi.py plugin/scholium.xpi
          python scripts/check_xpi.py plugin/scholium.xpi
      - name: write update.json for Zotero's plugin updater
        run: |
          VERSION=$(python -c "import json;print(json.load(open('plugin/scholium/manifest.json'))['version'])")
          cat > plugin/update.json <<EOF
          {"addons": {"scholium@zotero-scholium": {"updates": [{"version": "$VERSION",
            "update_link": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/scholium.xpi",
            "applications": {"zotero": {"strict_min_version": "6.999"}}}]}}}
          EOF
      - name: release notes from the changelog section of this version
        run: |
          python - "${{ github.ref_name }}" <<'EOF'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf8").read()
          m = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, flags=re.M | re.S)
          body = (m.group(1).strip() if m else "") or f"See CHANGELOG.md for {version}."
          open("release_notes.md", "w", encoding="utf8").write(body + "\n")
          print(body)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            plugin/scholium.xpi
            plugin/update.json
      - name: write the release notes also when the release already existed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release_notes.md
