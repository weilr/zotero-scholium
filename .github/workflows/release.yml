name: release

on:
  push:
    tags: ["v*"]

jobs:
  xpi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build scholium-bridge.xpi
        run: |
          cd plugin/scholium-bridge
          zip -r ../scholium-bridge.xpi manifest.json bootstrap.js
      - name: write update.json for Zotero's plugin updater
        run: |
          VERSION=$(python -c "import json;print(json.load(open('plugin/scholium-bridge/manifest.json'))['version'])")
          cat > plugin/update.json <<EOF
          {"addons": {"scholium-bridge@zotero-scholium": {"updates": [{"version": "$VERSION",
            "update_link": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/scholium-bridge.xpi",
            "applications": {"zotero": {"strict_min_version": "6.999"}}}]}}}
          EOF
      - name: release notes from the changelog section of this version
        run: |
          python - "${{ github.ref_name }}" <<'EOF'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf8").read()
          m = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text, flags=re.M | re.S)
          body = (m.group(1).strip() if m else "") or f"See CHANGELOG.md for {version}."
          open("release_notes.md", "w", encoding="utf8").write(body + "\n")
          print(body)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            plugin/scholium-bridge.xpi
            plugin/update.json
      - name: write the release notes also when the release already existed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release_notes.md
